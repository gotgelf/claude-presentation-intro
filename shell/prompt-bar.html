<!-- Prompt Bar -->
<div class="prompt-bar">
  <span class="prompt-label">Prompt</span>
  <span class="prompt-text" id="promptText">Navigate with arrow keys or click the sidebar.</span>
  <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
</div>
<div class="key-hint">
  <span><kbd>&#8592;</kbd> <kbd>&#8594;</kbd> Navigate</span>
  <span><kbd>F</kbd> Fullscreen</span>
</div>
